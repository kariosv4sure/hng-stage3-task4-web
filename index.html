<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insighta Labs+ | Login</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
      50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .animate-slide-up { animation: slide-up 0.8s ease-out forwards; }
    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }
  </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-purple-950 to-gray-900 min-h-screen flex items-center justify-center p-4">
  
  <!-- Animated background particles -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-purple-600/10 rounded-full blur-3xl animate-float"></div>
    <div class="absolute bottom-20 right-10 w-96 h-96 bg-violet-600/10 rounded-full blur-3xl animate-float" style="animation-delay: 1.5s;"></div>
    <div class="absolute top-1/2 left-1/2 w-64 h-64 bg-fuchsia-600/5 rounded-full blur-3xl animate-float" style="animation-delay: 0.7s;"></div>
  </div>

  <!-- Main card -->
  <div class="relative z-10 w-full max-w-md">
    <div class="bg-gray-800/60 backdrop-blur-xl border border-gray-700/50 rounded-2xl p-8 shadow-2xl animate-slide-up">
      
      <!-- Icon -->
      <div class="flex justify-center mb-6 opacity-0 animate-slide-up delay-1">
        <div class="w-20 h-20 bg-gradient-to-br from-purple-600 to-violet-600 rounded-2xl flex items-center justify-center animate-pulse-glow">
          <i class="fa-solid fa-brain text-3xl text-white"></i>
        </div>
      </div>
      
      <!-- Title -->
      <h1 class="text-3xl font-bold text-white text-center mb-1 opacity-0 animate-slide-up delay-2">
        Insighta Labs<span class="text-purple-400">+</span>
      </h1>
      <p class="text-gray-400 text-center text-sm mb-8 opacity-0 animate-slide-up delay-2">
        Profile Intelligence System
      </p>
      
      <!-- Login button -->
      <button id="loginBtn" 
              class="w-full bg-gray-700 hover:bg-gray-600 text-white font-medium py-3 px-6 rounded-xl flex items-center justify-center gap-3 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] border border-gray-600/50 opacity-0 animate-slide-up delay-3">
        <i class="fa-brands fa-github text-xl"></i>
        <span>Login with GitHub</span>
      </button>
      
      <!-- Hint -->
      <p class="text-gray-500 text-xs text-center mt-6 flex items-center justify-center gap-2">
        <i class="fa-solid fa-shield-halved text-purple-400"></i>
        Secure OAuth + JWT authentication
      </p>
    </div>
    
    <!-- Footer -->
    <p class="text-gray-600 text-xs text-center mt-6 opacity-0 animate-slide-up delay-3">
      <a href="/docs" class="hover:text-purple-400 transition-colors">API Docs</a>
      <span class="mx-2">·</span>
      Stage 3 · HNG Internship
    </p>
  </div>

  <script src="./js/auth.js"></script>
</body>
</html>
