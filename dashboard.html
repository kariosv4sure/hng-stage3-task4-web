<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insighta Labs+ | Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    .loader {
      width: 24px; height: 24px;
      border: 3px solid #4b5563;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="bg-gray-950 text-white min-h-screen">
  
  <!-- Navbar -->
  <nav class="bg-gray-900/80 backdrop-blur border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-brain text-sm"></i>
        </div>
        <span class="font-bold">Insighta Labs<span class="text-purple-400">+</span></span>
      </div>
      
      <div class="flex items-center gap-4">
        <span id="userDisplay" class="text-sm text-gray-400 hidden"></span>
        <button id="logoutBtn" class="text-sm text-gray-400 hover:text-red-400 transition-colors hidden">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="max-w-7xl mx-auto p-4">
    
    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <p class="text-gray-500 text-sm">Total Profiles</p>
        <p id="totalCount" class="text-2xl font-bold">-</p>
      </div>
      <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <p class="text-gray-500 text-sm">Countries</p>
        <p id="countryCount" class="text-2xl font-bold">-</p>
      </div>
      <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-4">
        <p class="text-gray-500 text-sm">Export</p>
        <button id="exportBtn" class="mt-2 bg-purple-600 hover:bg-purple-700 text-white text-sm px-4 py-2 rounded-lg transition">
          <i class="fa-solid fa-download mr-1"></i> CSV Export
        </button>
      </div>
    </div>

    <!-- Search -->
    <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-4 mb-6">
      <div class="flex gap-2">
        <input id="searchInput" type="text" placeholder="e.g. young males from nigeria..."
               class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-purple-500">
        <button id="searchBtn" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition text-sm">
          <i class="fa-solid fa-magnifying-glass mr-1"></i> Search
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-2 mb-4">
      <select id="filterGender" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1 text-sm">
        <option value="">All Genders</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <select id="filterAgeGroup" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1 text-sm">
        <option value="">All Ages</option>
        <option value="child">Child</option>
        <option value="teenager">Teenager</option>
        <option value="adult">Adult</option>
        <option value="senior">Senior</option>
      </select>
      <button id="applyFilters" class="bg-gray-700 hover:bg-gray-600 px-4 py-1 rounded-lg text-sm transition">
        Apply Filters
      </button>
    </div>

    <!-- Table -->
    <div class="bg-gray-900/50 border border-gray-800 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-800/50">
            <tr>
              <th class="px-4 py-3 text-left">Name</th>
              <th class="px-4 py-3 text-left">Gender</th>
              <th class="px-4 py-3 text-left">Age</th>
              <th class="px-4 py-3 text-left">Country</th>
              <th class="px-4 py-3 text-left">Confidence</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">
              <div class="loader mx-auto mb-2"></div>
              Loading profiles...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between mt-4 text-sm">
      <button id="prevPage" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg disabled:opacity-50 transition" disabled>
        <i class="fa-solid fa-chevron-left mr-1"></i> Previous
      </button>
      <span id="pageInfo" class="text-gray-400"></span>
      <button id="nextPage" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg disabled:opacity-50 transition">
        Next <i class="fa-solid fa-chevron-right ml-1"></i>
      </button>
    </div>

  </main>

  <script src="./js/api.js"></script>
  <script src="./js/dashboard.js"></script>
</body>
</html>
