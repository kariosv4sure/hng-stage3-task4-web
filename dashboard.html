<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insighta Labs+ | Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

    .loader {
      width: 24px;
      height: 24px;
      border: 3px solid #4b5563;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="bg-gray-950 text-white min-h-screen">

  <!-- NAV -->
  <nav class="bg-gray-900/80 backdrop-blur border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-brain text-sm"></i>
        </div>
        <span class="font-bold">Insighta Labs<span class="text-purple-400">+</span></span>
      </div>

      <div class="flex items-center gap-4">
        <span id="userDisplay" class="text-sm text-gray-400 hidden"></span>
        <button id="logoutBtn" class="text-sm text-red-400 hidden">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto p-4">

    <!-- STATS -->
    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
        <p class="text-gray-400 text-sm">Total Profiles</p>
        <p id="totalCount" class="text-2xl font-bold">-</p>
      </div>

      <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
        <p class="text-gray-400 text-sm">Countries</p>
        <p id="countryCount" class="text-2xl font-bold">-</p>
      </div>

      <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
        <p class="text-gray-400 text-sm">Export</p>
        <button id="exportBtn" class="mt-2 bg-purple-600 px-3 py-2 rounded-lg text-sm">
          Download CSV
        </button>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 mb-4 flex gap-2">
      <input id="searchInput"
             class="flex-1 bg-gray-800 px-3 py-2 rounded-lg text-sm"
             placeholder="Search profiles..." />
      <button id="searchBtn" class="bg-purple-600 px-4 py-2 rounded-lg text-sm">
        Search
      </button>
    </div>

    <!-- TABLE -->
    <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-800">
          <tr>
            <th class="p-3 text-left">Name</th>
            <th class="p-3 text-left">Gender</th>
            <th class="p-3 text-left">Age</th>
            <th class="p-3 text-left">Country</th>
            <th class="p-3 text-left">Confidence</th>
          </tr>
        </thead>

        <tbody id="tableBody">
          <tr>
            <td colspan="5" class="p-6 text-center text-gray-500">
              <div class="loader mx-auto mb-2"></div>
              Loading...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- PAGINATION -->
    <div class="flex justify-between mt-4 text-sm">
      <button id="prevPage" class="bg-gray-800 px-3 py-2 rounded-lg">Prev</button>
      <span id="pageInfo" class="text-gray-400"></span>
      <button id="nextPage" class="bg-gray-800 px-3 py-2 rounded-lg">Next</button>
    </div>

  </main>

  <script src="./js/api.js"></script>
  <script src="./js/dashboard.js"></script>
</body>
</html>
